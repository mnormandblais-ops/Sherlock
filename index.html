<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherlock Logic Puzzle Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 5px;
            color: #2c3e50;
        }
        #instructions {
            max-width: 600px;
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        canvas {
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            background-color: #fafafa;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-secondary {
            background-color: #e67e22;
            color: white;
        }
        .btn-secondary:hover { background-color: #d35400; }
        #status-message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 27px;
        }
        .status-continue { color: #7f8c8d; }
        .status-solved { color: #27ae60; }
        .status-lost { color: #c0392b; }
    </style>
</head>
<body>

    <h1>Sherlock Deductive Puzzle</h1>
    <div id="instructions">
        <strong>How to Play:</strong> Deduce the correct 4x4 unique placement matching the rules. 
        <br><strong>Left-Click</strong> an emoji candidate to lock it in as your choice. 
        <br><strong>Right-Click</strong> an emoji candidate to eliminate/cross it off.
    </div>

    <div id="game-container">
        <!-- Canvas dimensions updated to properly accommodate the new split layout layout -->
        <canvas id="gameCanvas" width="900" height="800"></canvas>
        <div class="controls">
            <button class="btn-primary" onclick="initNewGame()">New Puzzle</button>
            <button class="btn-secondary" onclick="toggleRevealSolution()">Reveal Solution</button>
        </div>
        <div id="status-message" class="status-continue">Game in progress...</div>
    </div>

    <script>
        const GRID_SIZE = 4;
        const EMOJI_GRID = [
            ['🤠', '🤡', '👽', '🤖'],  // Row 0: Characters
            ['🏠', '🏰', '⛺', '⚓'],  // Row 1: Places
            ['🍏', '🍓', '🍋', '🍇'],  // Row 2: Fruits
            ['🐱', '🐶', '🦊', '🦁']   // Row 3: Animals
        ];

        // Canvas UI Layout Constants
        const CELL_SIZE = 95;
        const BOARD_START_X = 40;
        const BOARD_START_Y = 50;
        
        // Clue Display Layout Dimensions
        const CLUE_BOX_W = 100;
        const CLUE_BOX_H = 75;
        const HORIZ_CLUE_START_X = 460;
        const HORIZ_CLUE_START_Y = 50;
        const VERT_CLUE_START_X = 40;
        const VERT_CLUE_START_Y = 480;

        class SherlockEngine {
            constructor() {
                this.solution = [];
                this.clues = [];
            }

            generatePuzzle() {
                this._generateSolution();
                this._generateMinimalClueSet();
                return {
                    solution: this._serializeSolution(),
                    clues: this.clues
                };
            }

            _generateSolution() {
                this.solution = [];
                for (let r = 0; r < GRID_SIZE; r++) {
                    let items = [0, 1, 2, 3];
                    for (let i = items.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [items[i], items[j]] = [items[j], items[i]];
                    }
                    // Adjusted fix to map arrays directly to column index slots
                    this.solution.push(items.map(itemIdx => ({ rowIdx: r, itemIdx: itemIdx })));
                }
            }

            _serializeSolution() {
                return this.solution.map((row, r) => row.map(cell => EMOJI_GRID[r][cell.itemIdx]));
            }

            _evaluateClueSetQuality(testClues) {
                let virtualBoard = [];
                for (let r = 0; r < GRID_SIZE; r++) {
                    let row = [];
                    for (let c = 0; c < GRID_SIZE; c++) {
                        row.push([0, 1, 2, 3]);
                    }
                    virtualBoard.push(row);
                }

                let changed = true;
                let iterations = 0;

                while (changed && iterations < 20) {
                    changed = false;
                    iterations++;

                    for (let clue of testClues) {
                        let r1 = clue.it1.rowIdx, i1 = clue.it1.itemIdx;
                        let r2 = clue.it2.rowIdx, i2 = clue.it2.itemIdx;

                        if (clue.type === 'SAME_COL') {
                            for (let c = 0; c < GRID_SIZE; c++) {
                                if (!virtualBoard[r1][c].includes(i1) && virtualBoard[r2][c].includes(i2)) {
                                    let oldLen = virtualBoard[r2][c].length;
                                    virtualBoard[r2][c] = virtualBoard[r2][c].filter(x => x !== i2);
                                    if (virtualBoard[r2][c].length !== oldLen) changed = true;
                                }
                                if (!virtualBoard[r2][c].includes(i2) && virtualBoard[r1][c].includes(i1)) {
                                    let oldLen = virtualBoard[r1][c].length;
                                    virtualBoard[r1][c] = virtualBoard[r1][c].filter(x => x !== i1);
                                    if (virtualBoard[r1][c].length !== oldLen) changed = true;
                                }
                            }
                        } 
                        else if (clue.type === 'NOT_SAME_COL') {
                            for (let c = 0; c < GRID_SIZE; c++) {
                                if (virtualBoard[r1][c].length === 1 && virtualBoard[r1][c][0] === i1 && virtualBoard[r2][c].includes(i2)) {
                                    let oldLen = virtualBoard[r2][c].length;
                                    virtualBoard[r2][c] = virtualBoard[r2][c].filter(x => x !== i2);
                                    if (virtualBoard[r2][c].length !== oldLen) changed = true;
                                }
                                if (virtualBoard[r2][c].length === 1 && virtualBoard[r2][c][0] === i2 && virtualBoard[r1][c].includes(i1)) {
                                    let oldLen = virtualBoard[r1][c].length;
                                    virtualBoard[r1][c] = virtualBoard[r1][c].filter(x => x !== i1);
                                    if (virtualBoard[r1][c].length !== oldLen) changed = true;
                                }
                            }
                        } 
                        else if (clue.type === 'LEFT_OF') {
                            let minCol1 = 4, maxCol2 = -1;
                            for (let c = 0; c < GRID_SIZE; c++) {
                                if (virtualBoard[r1][c].includes(i1) && c < minCol1) minCol1 = c;
                                if (virtualBoard[r2][c].includes(i2) && c > maxCol2) maxCol2 = c;
                            }
                            for (let c = 0; c < GRID_SIZE; c++) {
                                if (c >= maxCol2 && virtualBoard[r1][c].includes(i1)) {
                                    let oldLen = virtualBoard[r1][c].length;
                                    virtualBoard[r1][c] = virtualBoard[r1][c].filter(x => x !== i1);
                                    if (virtualBoard[r1][c].length !== oldLen) changed = true;
                                }
                                if (c <= minCol1 && virtualBoard[r2][c].includes(i2)) {
                                    let oldLen = virtualBoard[r2][c].length;
                                    virtualBoard[r2][c] = virtualBoard[r2][c].filter(x => x !== i2);
                                    if (virtualBoard[r2][c].length !== oldLen) changed = true;
                                }
                            }
                        } 
                        else if (clue.type === 'ADJACENT') {
                            for (let c = 0; c < GRID_SIZE; c++) {
                                if (virtualBoard[r1][c].includes(i1)) {
                                    let neighborLeft = c > 0 && virtualBoard[r2][c-1].includes(i2);
                                    let neighborRight = c < 3 && virtualBoard[r2][c+1].includes(i2);
                                    if (!neighborLeft && !neighborRight) {
                                        let oldLen = virtualBoard[r1][c].length;
                                        virtualBoard[r1][c] = virtualBoard[r1][c].filter(x => x !== i1);
                                        if (virtualBoard[r1][c].length !== oldLen) changed = true;
                                    }
                                }
                                if (virtualBoard[r2][c].includes(i2)) {
                                    let neighborLeft = c > 0 && virtualBoard[r1][c-1].includes(i1);
                                    let neighborRight = c < 3 && virtualBoard[r1][c+1].includes(i1);
                                    if (!neighborLeft && !neighborRight) {
                                        let oldLen = virtualBoard[r2][c].length;
                                        virtualBoard[r2][c] = virtualBoard[r2][c].filter(x => x !== i2);
                                        if (virtualBoard[r2][c].length !== oldLen) changed = true;
                                    }
                                }
                            }
                        }
                    }

                    // Column Unique Constraints Scan
                    for (let r = 0; r < GRID_SIZE; r++) {
                        for (let c = 0; c < GRID_SIZE; c++) {
                            if (virtualBoard[r][c].length === 1) {
                                let fixedVal = virtualBoard[r][c][0];
                                for (let colScan = 0; colScan < GRID_SIZE; colScan++) {
                                    if (colScan !== c && virtualBoard[r][colScan].includes(fixedVal)) {
                                        let oldLen = virtualBoard[r][colScan].length;
                                        virtualBoard[r][colScan] = virtualBoard[r][colScan].filter(x => x !== fixedVal);
                                        if (virtualBoard[r][colScan].length !== oldLen) changed = true;
                                    }
                                }
                            }
                        }
                    }
                }

                let solvedCount = 0;
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (virtualBoard[r][c].length === 1) solvedCount++;
                    }
                }
                return solvedCount;
            }

            // Generates clues, then minimizes the pool down to only what is necessary to solve it
            _generateMinimalClueSet() {
                let pool = [];
                const types = ['LEFT_OF', 'ADJACENT', 'SAME_COL', 'NOT_SAME_COL'];

                // 1. Build a massive pool of valid true clues first
                for (let generationAttempts = 0; generationAttempts < 500; generationAttempts++) {
                    let r1 = Math.floor(Math.random() * 4), c1 = Math.floor(Math.random() * 4);
                    let r2 = Math.floor(Math.random() * 4), c2 = Math.floor(Math.random() * 4);
                    if (r1 === r2 && c1 === c2) continue;

                    let it1 = this.solution[r1][c1];
                    let it2 = this.solution[r2][c2];
                    let clueType = types[Math.floor(Math.random() * types.length)];

                    if ((clueType === 'SAME_COL' || clueType === 'NOT_SAME_COL') && r1 === r2) continue;

                    let candidate = null;
                    if (clueType === 'SAME_COL' && c1 === c2) {
                        candidate = { type: clueType, it1: it1, it2: it2 };
                    } else if (clueType === 'NOT_SAME_COL' && c1 !== c2) {
                        candidate = { type: clueType, it1: it1, it2: it2 };
                    } else if (clueType === 'LEFT_OF' && c1 < c2) {
                        candidate = { type: clueType, it1: it1, it2: it2 };
                    } else if (clueType === 'ADJACENT' && Math.abs(c1 - c2) === 1) {
                        candidate = c1 < c2 ? { type: clueType, it1: it1, it2: it2 } : { type: clueType, it1: it2, it2: it1 };
                    }

                    if (candidate) {
                        let exists = pool.some(c => 
                            c.type === candidate.type &&
                            c.it1.rowIdx === candidate.it1.rowIdx && c.it1.itemIdx === candidate.it1.itemIdx &&
                            c.it2.rowIdx === candidate.it2.rowIdx && c.it2.itemIdx === candidate.it2.itemIdx
                        );
                        if (!exists) pool.push(candidate);
                    }
                }

                // Shuffle pool to vary clues chosen
                pool.sort(() => Math.random() - 0.5);

                // Verify pool can solve it; if not, retry simple base layout configuration setup
                if (this._evaluateClueSetQuality(pool) !== 16) {
                    // Fail-safe fall back to a simple puzzle layout if randomized generation parameters missed optimal bounds
                    this.clues = pool.slice(0, 14); 
                    return;
                }

                // 2. Eliminate unnecessary clues one by one
                let workingClues = [...pool];
                for (let i = workingClues.length - 1; i >= 0; i--) {
                    let candidateSet = workingClues.filter((_, idx) => idx !== i);
                    if (this._evaluateClueSetQuality(candidateSet) === 16) {
                        workingClues.splice(i, 1); // Not necessary! Remove it.
                    }
                }

                this.clues = workingClues;
            }

            verifyPlayerAction(currentBoardState) {
                let matchesSolutionCount = 0;
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        let correctIdx = this.solution[r][c].itemIdx;
                        let currentList = currentBoardState[r][c];

                        if (!currentList.includes(correctIdx)) return "LOST";
                        if (currentList.length === 1 && currentList[0] !== correctIdx) return "LOST";
                        if (currentList.length === 1 && currentList[0] === correctIdx) matchesSolutionCount++;
                    }
                }
                return matchesSolutionCount === 16 ? "SOLVED" : "CONTINUE";
            }
        }

        let engine;
        let puzzleData;
        let playerBoardState = [];
        let gameState = "CONTINUE";
        let revealSolution = false;

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function initNewGame() {
            engine = new SherlockEngine();
            puzzleData = engine.generatePuzzle();
            revealSolution = false;
            gameState = "CONTINUE";
            
            playerBoardState = [];
            for (let r = 0; r < GRID_SIZE; r++) {
                let row = [];
                for (let c = 0; c < GRID_SIZE; c++) {
                    row.push([0, 1, 2, 3]);
                }
                playerBoardState.push(row);
            }

            updateStatusUI();
            draw();
        }

        function updateStatusUI() {
            const el = document.getElementById("status-message");
            el.className = "";
            if (gameState === "SOLVED") {
                el.innerText = "🎉 Congratulations! You solved the mystery!";
                el.classList.add("status-solved");
            } else if (gameState === "LOST") {
                el.innerText = "❌ Logic Contradiction! Game over.";
                el.classList.add("status-lost");
            } else {
                el.innerText = "🕵️‍♂️ Deduce carefully using the visual clues...";
                el.classList.add("status-continue");
            }
        }

        function toggleRevealSolution() {
            revealSolution = !revealSolution;
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Titles
            ctx.fillStyle = "#2c3e50";
            ctx.font = "bold 16px sans-serif";
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            ctx.fillText("PLAYER DEDUCTION BOARD", BOARD_START_X, 15);
            ctx.fillText("HORIZONTAL CLUES (RIGHT SIDE)", HORIZ_CLUE_START_X, 15);
            ctx.fillText("VERTICAL CLUES (UNDER BOARD)", VERT_CLUE_START_X, VERT_CLUE_START_Y - 30);

            // 2. Draw Main Board Columns
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let x = BOARD_START_X + c * CELL_SIZE;
                    let y = BOARD_START_Y + r * CELL_SIZE;

                    ctx.strokeStyle = "#bdc3c7";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);

                    if (revealSolution) {
                        ctx.fillStyle = "#e8f8f5";
                        ctx.fillRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4);
                        ctx.font = "36px sans-serif";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillStyle = "#000";
                        ctx.fillText(puzzleData.solution[r][c], x + CELL_SIZE/2, y + CELL_SIZE/2);
                    } else {
                        let list = playerBoardState[r][c];
                        if (list.length === 1) {
                            ctx.fillStyle = "#ebf5fb";
                            ctx.fillRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4);
                            ctx.font = "38px sans-serif";
                            ctx.textAlign = "center";
                            ctx.textBaseline = "middle";
                            ctx.fillText(EMOJI_GRID[r][list[0]], x + CELL_SIZE/2, y + CELL_SIZE/2);
                        } else {
                            ctx.font = "18px sans-serif";
                            ctx.textAlign = "center";
                            ctx.textBaseline = "middle";

                            for (let idx = 0; idx < 4; idx++) {
                                let subX = x + (idx % 2) * (CELL_SIZE / 2) + (CELL_SIZE / 4);
                                let subY = y + Math.floor(idx / 2) * (CELL_SIZE / 2) + (CELL_SIZE / 4);

                                if (list.includes(idx)) {
                                    ctx.globalAlpha = 1.0;
                                    ctx.fillText(EMOJI_GRID[r][idx], subX, subY);
                                } else {
                                    ctx.globalAlpha = 0.15;
                                    ctx.fillText(EMOJI_GRID[r][idx], subX, subY);
                                    ctx.globalAlpha = 1.0;
                                }
                            }
                        }
                    }
                }
            }

            // Separator components
            let horizontalClues = [];
            let verticalClues = [];

            if (puzzleData && puzzleData.clues) {
                puzzleData.clues.forEach(clue => {
                    if (clue.type === "LEFT_OF" || clue.type === "ADJACENT") {
                        horizontalClues.push(clue);
                    } else {
                        verticalClues.push(clue);
                    }
                });
            }

            // Helper to render individual clue boxes
            function drawClueBox(clue, cx, cy) {
                ctx.fillStyle = "#ffffff";
                ctx.strokeStyle = "#d5dbdb";
                ctx.lineWidth = 1.5;
                ctx.fillRect(cx, cy, CLUE_BOX_W, CLUE_BOX_H);
                ctx.strokeRect(cx, cy, CLUE_BOX_W, CLUE_BOX_H);

                let itemLeft = EMOJI_GRID[clue.it1.rowIdx][clue.it1.itemIdx];
                let itemRight = EMOJI_GRID[clue.it2.rowIdx][clue.it2.itemIdx];

                ctx.font = "24px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#000";

                if (clue.type === "SAME_COL") {
                    ctx.fillText(itemLeft, cx + CLUE_BOX_W / 2, cy + 20);
                    ctx.font = "bold 14px sans-serif";
                    ctx.fillStyle = "#27ae60";
                    ctx.fillText("┃", cx + CLUE_BOX_W / 2, cy + 38);
                    ctx.font = "24px sans-serif";
                    ctx.fillText(itemRight, cx + CLUE_BOX_W / 2, cy + 55);
                } 
                else if (clue.type === "NOT_SAME_COL") {
                    ctx.fillText(itemLeft, cx + CLUE_BOX_W / 2, cy + 20);
                    ctx.font = "bold 14px sans-serif";
                    ctx.fillStyle = "#c0392b";
                    ctx.fillText("⿾", cx + CLUE_BOX_W / 2, cy + 38);
                    ctx.font = "24px sans-serif";
                    ctx.fillText(itemRight, cx + CLUE_BOX_W / 2, cy + 55);
                } 
                else if (clue.type === "LEFT_OF") {
                    ctx.fillText(itemLeft, cx + 25, cy + CLUE_BOX_H / 2);
                    ctx.font = "bold 14px sans-serif";
                    ctx.fillStyle = "#2980b9";
                    ctx.fillText("➔", cx + CLUE_BOX_W / 2, cy + CLUE_BOX_H / 2);
                    ctx.font = "24px sans-serif";
                    ctx.fillText(itemRight, cx + CLUE_BOX_W - 25, cy + CLUE_BOX_H / 2);
                } 
                else if (clue.type === "ADJACENT") {
                    ctx.fillText(itemLeft, cx + 25, cy + CLUE_BOX_H / 2);
                    ctx.font = "bold 14px sans-serif";
                    ctx.fillStyle = "#f39c12";
                    ctx.fillText("↔", cx + CLUE_BOX_W / 2, cy + CLUE_BOX_H / 2);
                    ctx.font = "24px sans-serif";
                    ctx.fillText(itemRight, cx + CLUE_BOX_W - 25, cy + CLUE_BOX_H / 2);
                }
            }

            // 3. Render Horizontal Clues (Right Side, max 4 items per row)
            horizontalClues.forEach((clue, index) => {
                let col = index % 4;
                let row = Math.floor(index / 4);
                let cx = HORIZ_CLUE_START_X + col * (CLUE_BOX_W + 10);
                let cy = HORIZ_CLUE_START_Y + row * (CLUE_BOX_H + 10);
                drawClueBox(clue, cx, cy);
            });

            // 4. Render Vertical Clues (Underneath Board, max 7 items per row)
            verticalClues.forEach((clue, index) => {
                let col = index % 7;
                let row = Math.floor(index / 7);
                let cx = VERT_CLUE_START_X + col * (CLUE_BOX_W + 10);
                let cy = VERT_CLUE_START_Y + row * (CLUE_BOX_H + 10);
                drawClueBox(clue, cx, cy);
            });
        }

        function handleBoardClick(e, isRightClick) {
            if (gameState !== "CONTINUE" || revealSolution) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let x = BOARD_START_X + c * CELL_SIZE;
                    let y = BOARD_START_Y + r * CELL_SIZE;

                    if (mouseX >= x && mouseX < x + CELL_SIZE && mouseY >= y && mouseY < y + CELL_SIZE) {
                        let innerX = mouseX - x;
                        let innerY = mouseY - y;
                        
                        let subCol = Math.floor(innerX / (CELL_SIZE / 2));
                        let subRow = Math.floor(innerY / (CELL_SIZE / 2));
                        let itemClicked = subRow * 2 + subCol;

                        let currentCandidates = playerBoardState[r][c];

                        if (isRightClick) {
                            if (currentCandidates.includes(itemClicked)) {
                                playerBoardState[r][c] = currentCandidates.filter(val => val !== itemClicked);
                            } else {
                                playerBoardState[r][c].push(itemClicked);
                                playerBoardState[r][c].sort();
                            }
                        } else {
                            if (currentCandidates.length === 1 && currentCandidates[0] === itemClicked) {
                                playerBoardState[r][c] = [0, 1, 2, 3];
                            } else {
                                playerBoardState[r][c] = [itemClicked];
                            }
                        }

                        gameState = engine.verifyPlayerAction(playerBoardState);
                        updateStatusUI();
                        draw();
                        return;
                    }
                }
            }
        }

        canvas.addEventListener("click", function(e) {
            handleBoardClick(e, false);
        });

        canvas.addEventListener("contextmenu", function(e) {
            e.preventDefault();
            handleBoardClick(e, true);
            return false;
        });

        window.onload = initNewGame;
    </script>
</body>
</html>
